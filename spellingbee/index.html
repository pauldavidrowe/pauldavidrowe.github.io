<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bee Tracker" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Spelling Bee Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>🐝 Bee Tracker</h1>
  </header>

  <!-- Mode tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="log">Log</button>
    <button class="tab" data-tab="explore">Explore</button>
  </nav>

  <!-- ══════════════════════════════════════════
       LOG PANEL
  ══════════════════════════════════════════ -->
  <section id="panel-log" class="panel active">

    <!-- Entry type selector -->
    <div class="type-selector">
      <button class="type-btn active" data-type="word">Word</button>
      <button class="type-btn" data-type="association">Association</button>
    </div>

    <!-- Word toggles (visible in Word mode only) -->
    <div id="word-options" class="toggle-group">
      <div class="toggle-row">
        <span class="toggle-label">I missed it</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-missed" checked />
          <span class="toggle-thumb"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">NYT accepts it</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-valid" checked />
          <span class="toggle-thumb"></span>
        </label>
      </div>
    </div>

    <!-- Word input (shared across all types) -->
    <div class="input-group">
      <label for="log-word-input" id="log-word-label">Word to log</label>
      <div class="autocomplete-wrapper">
        <input
          type="text"
          id="log-word-input"
          class="word-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Type a word…"
        />
        <ul id="log-word-dropdown" class="dropdown" hidden></ul>
      </div>
    </div>

    <!-- Association "to" field — only visible in association mode -->
    <div class="input-group" id="assoc-to-group" hidden>
      <label for="log-to-input">…reminds me of</label>
      <div class="autocomplete-wrapper">
        <input
          type="text"
          id="log-to-input"
          class="word-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Type a word…"
        />
        <ul id="log-to-dropdown" class="dropdown" hidden></ul>
      </div>
    </div>

    <button id="log-submit-btn" class="btn-primary">Add missed word</button>
    <p id="log-feedback" class="feedback" hidden></p>

  </section>

  <!-- ══════════════════════════════════════════
       EXPLORE PANEL
  ══════════════════════════════════════════ -->
  <section id="panel-explore" class="panel" hidden>

    <!-- Sub-tabs: Lookup vs Associations -->
    <div class="type-selector">
      <button class="type-btn active" data-explore="lookup">Word lookup</button>
      <button class="type-btn" data-explore="assoc-query">Associations</button>
      <button class="type-btn" data-explore="all-words">All words</button>
    </div>

    <!-- ── Word lookup ── -->
    <div id="explore-lookup" class="explore-view active">
      <div class="input-group">
        <label for="explore-word-input">Look up a word</label>
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="explore-word-input"
            class="word-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Type a word…"
          />
          <ul id="explore-word-dropdown" class="dropdown" hidden></ul>
        </div>
      </div>
      <div id="lookup-result" class="result-card" hidden></div>
    </div>

    <!-- ── Association query ── -->
    <div id="explore-assoc-query" class="explore-view" hidden>
      <div class="input-group">
        <label for="assoc-query-input">Find associations from a word</label>
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="assoc-query-input"
            class="word-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Type a word…"
          />
          <ul id="assoc-query-dropdown" class="dropdown" hidden></ul>
        </div>
      </div>
      <div id="assoc-query-result" class="result-card" hidden></div>
    </div>

    <!-- ── All words ── -->
    <div id="explore-all-words" class="explore-view" hidden>
      <div class="input-group">
        <input
          type="text"
          id="filter-input"
          class="word-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Filter words…"
        />
      </div>
      <div class="all-words-options">
        <span class="toggle-label">Show known &amp; invalid words</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-show-all-words" />
          <span class="toggle-thumb"></span>
        </label>
      </div>
      <div id="all-words-list" class="word-list"></div>
    </div>

  </section>

  <!-- ══════════════════════════════════════════
       DATA MANAGEMENT (bottom of screen)
  ══════════════════════════════════════════ -->
  <footer>
    <button class="btn-secondary" id="export-btn">Export</button>
    <button class="btn-secondary" id="import-btn">Import</button>
    <input type="file" id="import-file-input" accept=".json" hidden />
  </footer>

  <script src="app.js"></script>
  <script src="ui.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(console.warn);
    }
  </script>
</body>
</html>
